# SPDX-License-Identifier: Apache-2.0
defaults:
  - /ppo_trainer
  - override /model_engine: megatron
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

rlk:
  multinode: false
  actor_node_ips: []
  preflight_files: []
  sync_dir: ???
  audit_prompts:
    - "Read this passage and then give one word: A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. A small bird flies over a green field. What color is the field?"
    - "Read this passage and answer briefly: The river flows past a quiet village. The river flows past a quiet village. The river flows past a quiet village. The river flows past a quiet village. What flows past the village?"
    - "Say a short word."
  audit_response_length: 3

trainer:
  use_v1: true
  nnodes: 1
  n_gpus_per_node: 2
  resume_mode: disable
  total_training_steps: 3
  val_before_train: false
  test_freq: -1
  logger: [console]
  v1:
    trainer_mode: sync

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  rollout_correction:
    bypass_mode: false

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: ???
    use_remove_padding: false
    use_fused_kernels: false
  actor:
    strategy: megatron
    use_kl_loss: false
    entropy_coeff: 0.0
    use_dynamic_bsz: false
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 1
    ppo_epochs: 1
    megatron:
      _target_: verl.experimental.rl_kernel.trainer_engine.RLKVerlMcoreEngineConfig
      strategy: rlk_verl_megatron
      rlk_mhc_backend: rocm_triton
      rlk_allow_right_padding: true
      rlk_evidence_dir: ${rlk.sync_dir}
      pipeline_model_parallel_size: 2
      tensor_model_parallel_size: 1
      expert_model_parallel_size: 1
      context_parallel_size: 1
      sequence_parallel: false
      use_distributed_optimizer: false
      param_offload: false
      optimizer_offload: false
      use_remove_padding: false
      use_fused_kernels: false
      override_transformer_config:
        gradient_accumulation_fusion: false
        recompute_granularity: null
        apply_rope_fusion: false
        moe_permute_fusion: false
        moe_shared_expert_overlap: false
  rollout:
    rlk_node_ips: []
    rlk_sync_dir: ${rlk.sync_dir}
    _target_: rl_engine.integrations.orchestrators.verl.pipeline_rollout.RLKPipelineRolloutConfig
    name: vllm
    nnodes: 1
    n_gpus_per_node: 2
    pipeline_model_parallel_size: 2
    tensor_model_parallel_size: 1
    expert_parallel_size: 1
    data_parallel_size: 1
    enforce_eager: true
    enable_sleep_mode: false
    enable_prefix_caching: false
    free_cache_engine: false
    calculate_log_probs: true
    logprobs_mode: raw_logprobs
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 2
    load_format: safetensors
    gpu_memory_utilization: 0.30
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    engine_kwargs:
      vllm:
        rlk_mhc_backend: ${actor_rollout_ref.actor.megatron.rlk_mhc_backend}
        compilation_config:
          cudagraph_mode: NONE
    val_kwargs:
      temperature: 1.0
      top_p: 1.0
      top_k: -1
    checkpoint_engine:
      backend: naive

data:
  train_files: ???
  val_files: ???
  train_batch_size: 1
